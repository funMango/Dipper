# 스마트교차로 온톨로지 v2 원본
# 계층: 교차로 > 방향(접근로) > 좌/직/우(회전)
# 상태 표시: 확인 = 회사 DB에서 세거나 읽음 / 미확인 = 답을 받지 못함(추정으로 채우지 않음)
ontology: smart_intersection
version: 2
created: "2026-11-26"
approved: "민호님 2026-11-26 08:50 (업무 팀장봇 전달)"
source:
  database: "회사 Oracle DB, 소유자 CRSRD (읽기 전용 조회)"
  store: ".dipper/traffic_volume.duckdb, 스키마 onto_v2"
  loaded_at: "2026-11-26 08:53:12"
  views_file: "ontology/smart_intersection/views.sql"
  glossary_file: "ontology/smart_intersection/glossary_ai.md"
  excluded_sources:
    - "카메라 전환 프로그램 14_교통량 DB전환 프로그램, 15_인텔리빅스 결측 데이터 전환 프로그램"
    - "카메라 엑셀(수정본, 원본)"
    - "백업 카메라 목록 unique_cameras.json"

terms:
  - word: "방향"
    means: "접근로(Approach). DB 테이블 M_CRSRD_ACSR_INF"
    status: 확인
    caution: "DB의 '교차로 방향'(DRCT_CD)은 좌/직/우를 뜻한다. 민호님의 '방향'과 다르다."
  - word: "좌/직/우"
    means: "회전(Movement). DB 컬럼 DRCT_CD, 코드 그룹명 '교차로 방향'"
    status: 확인
  - word: "북(남향)"
    means: "진입 위치 '북' + 진행 방향 '남향'. 진행 방향은 늘 진입 위치의 반대"
    status: 확인
    evidence: "ACSR_NM 1,032행 모두 위치와 '(..향)'이 읽히고, 1,032행 모두 반대 방위"

classes:
  Intersection:
    label: 교차로
    table: onto_v2.m_crsrd_inf
    source_table: CRSRD.M_CRSRD_INF
    key: [node_id]
    human_key: "crsrd_nm (CRSRD_NM)"
    count: 286
    view: onto_v2.v_intersection
    attributes: [node_id, crsrd_nm, sgnl_crsrd_nm, sgnl_crsrd_no, stnd_node_id, crsrd_cls, lng_crdn, lat_crdn, use_yn]
    status: 확인

  Approach:
    label: "방향(접근로)"
    table: onto_v2.m_crsrd_acsr_inf
    source_table: CRSRD.M_CRSRD_ACSR_INF
    key: [node_id, acsr_id]
    machine_key: "NODE_ID:ACSR_ID"
    human_key: "<교차로명> <진입위치>(<진행방향>향)  예: '<교차로명> 북(남향)'"
    direction_label_format: "<진입위치>(<진행방향>향)"
    count_rows: 1032
    count_distinct_keys: 1031
    view: onto_v2.v_approach
    join_view: onto_v2.v_approach_key
    derived:
      position_bearing: "ACSR_NM의 '-<방위> (' 부분. 동북→북동, 동남→남동, 서남→남서, 서북→북서로 정규화"
      heading_bearing: "position_bearing의 반대 방위(v_bearing)"
    notes:
      - "DB에 PK가 선언되어 있지 않다."
      - "ACSR_DRCT 코드는 키로 쓰지 않는다. ACSR_NM 위치와 56행이 다르다."
      - "ACSR_ID는 교차로 안에서만 유일하다. 늘 NODE_ID와 함께 쓴다."
    status: 확인

  Movement:
    label: "좌/직/우(회전)"
    table: onto_v2.m_crsrd_drct_inf
    source_table: CRSRD.M_CRSRD_DRCT_INF
    key: [node_id, acsr_id, drct_cd]
    machine_key: "NODE_ID:ACSR_ID:DRCT_CD"
    human_key: "<교차로명> <진입위치>(<진행방향>향) <좌|직|우|유턴|직우>"
    count: 4122
    view: onto_v2.v_movement
    codes: {"01": 좌회전, "02": 직진, "03": 우회전, "04": 유턴, "05": 직우}
    short: {"01": 좌, "02": 직, "03": 우, "04": 유턴, "05": 직우}
    notes:
      - "마스터에는 01~04만 있다(05 직우는 측정 테이블에만 있음)."
      - "측정 테이블에는 00, 07, 09, 11 같은 코드 밖 값이 섞여 있어 분석 때 01~05로 거른다."
    status: 확인

  Lane:
    label: 차로
    table: onto_v2.m_crsrd_lane_inf
    source_table: CRSRD.M_CRSRD_LANE_INF
    key: [node_id, acsr_id, drct_cd, lane_no, area_seqno]
    count: 2709
    view: onto_v2.v_lane
    notes:
      - "이 테이블의 DRCT_CD는 01~10이다. 회전 코드(01~05)와 범위가 달라 코드표에 잇지 않는다."
    status: "확인(개수), 미확인(DRCT_CD 코드표)"

  Camera:
    label: 카메라
    table: onto_v2.m_cmr_inf
    source_table: CRSRD.M_CMR_INF
    key: [cmr_id]
    human_key: "<교차로명> <진입위치>(<진행방향>향) 카메라 <CMR_ID>"
    count: 1344
    view: onto_v2.v_camera
    loaded_columns_excluded: "IP, RTSP 주소, 게이트웨이, 포트, UID, 로그인·비밀번호 계열은 조회하지 않음"
    links:
      intersection: "M_CMR_INF.NODE_ID → M_CRSRD_INF.NODE_ID (1,344/1,344)"
      approach: "M_CMR_INF.(NODE_ID, ACSR_ID) → M_CRSRD_ACSR_INF (1,338/1,338, ACSR_ID 빈 카메라 6대)"
    traffic_camera_rule: "교통량은 이름에 '-교-'가 있는 카메라만 센다(민호님 규칙). 현재 836대"
    role: 미확인
    role_note: "이름의 '4K', '과', 가상 카메라(VRTL_CMR_YN=Y)의 역할은 미확인. CMR_CLS는 모두 비어 있다."
    status: "확인(연결), 미확인(역할)"

  SignalController:
    label: 신호 제어기
    table: onto_v2.m_crsrd_sgnl_inf
    source_table: CRSRD.M_CRSRD_SGNL_INF
    key: [sgnl_ctrl_id]
    count: 286
    view: onto_v2.v_signal_controller
    id_rule: "SGNL_CTRL_ID = 'SGNLC' + SGNL_CRSRD_NO 5자리 (286/286)"
    status: 확인

  ApproachSignalPlan:
    label: "방향(접근로) 신호 조건"
    table: onto_v2.m_crsrd_acsr_sgnl_cndt
    source_table: CRSRD.M_CRSRD_ACSR_SGNL_CNDT
    key: [node_id, acsr_id]
    count: 1033
    view: onto_v2.v_approach_signal
    attributes:
      cycl: "주기(초)"
      grn_tm: "녹색 시간 (이력 테이블 주석: 직진 녹색시간(초))"
      ylw_tm: "황색 시간"
      pdst_grn_tm: "보행 녹색 시간"
      itrs_offs: "오프셋"
      lftrn_form: "좌회전 형태 코드(LFTRN_FORM)"
      lftrn_grn_tm: "좌회전 녹색 시간"
      lftrn_ylw_tm: "좌회전 황색 시간"
      stlf_grn_tm: "직좌 녹색 시간"
      stlf_ylw_tm: "직좌 황색 시간"
    history_in_company_db: "CRSRD.L_KHCM_CRSRD_ACSR_SGNL_CNDT_15MI / _1HH (store에는 적재하지 않음)"
    notes:
      - "현재값이며 회사 DB에서 계속 갱신된다. store 사본은 적재 시점 값이다."
    status: 확인

  Code:
    label: 공통 코드
    tables: [onto_v2.m_cd_inf, onto_v2.m_cd_grp_inf]
    count_codes: 136
    count_groups: 22
    view: onto_v2.v_code
    notes:
      - "M_CD_INF에는 그룹이 23개다. LNK_PRGR_DRCT 그룹(2코드)은 M_CD_GRP_INF에 없다."
    status: 확인

  Bearing:
    label: 방위
    view: onto_v2.v_bearing
    values: [북, 북동, 동, 남동, 남, 남서, 서, 북서]
    synonyms: {동북: 북동, 동남: 남동, 서남: 남서, 서북: 북서}
    status: 확인

relations:
  - {from: Intersection, rel: has_approach, to: Approach, keys: [node_id], cardinality: "1 : 2~4", evidence: "방향 2개 1곳, 3개 111곳, 4개 174곳(키 기준)", status: 확인}
  - {from: Approach, rel: has_movement, to: Movement, keys: [node_id, acsr_id], cardinality: "1 : 1~4", evidence: "4,122행 중 접근로 마스터에 없는 키 46행", status: 확인}
  - {from: Approach, rel: has_lane, to: Lane, keys: [node_id, acsr_id], cardinality: "1 : 0..N", evidence: "2,709행 중 접근로 마스터에 없는 키 25행", status: 확인}
  - {from: Intersection, rel: controlled_by, to: SignalController, keys: [node_id], cardinality: "1 : 1", evidence: "286/286", status: 확인}
  - {from: Approach, rel: has_signal_plan, to: ApproachSignalPlan, keys: [node_id, acsr_id], cardinality: "1 : 1", evidence: "모든 접근로 키에 신호 조건 있음. 신호 조건 2행은 접근로 마스터에 없는 키", status: 확인}
  - {from: Camera, rel: at, to: Intersection, keys: [node_id], cardinality: "N : 1", evidence: "1,344/1,344, 교차로 286곳 모두 카메라 있음", status: 확인}
  - {from: Camera, rel: observes, to: Approach, keys: [node_id, acsr_id], cardinality: "N : 1", evidence: "1,338/1,338, 방향 1,028개", status: 확인}
  - {from: Movement, rel: coded_by, to: Code, keys: ["drct_cd = cd (grp_cd='DRCT_CD')"], status: 확인}
  - {from: Approach, rel: coded_by, to: Code, keys: ["acsr_drct = cd (grp_cd='ACSR_DRCT')"], note: "참고용. 키로 쓰지 않음", status: 확인}

forbidden_joins:
  - table: CRSRD.M_CRSRD_SGNL_CMR_MC
    reason: "사용 여부 미확인. 제어기 ID가 신호 마스터와 405/739행만 맞음. 조인하지 않고 store에도 적재하지 않음"
    status: 미확인
  - table: "CRSRD.M_CRSRD_SGNL_AREA_CNFG_INF.AREA_SEQNO ↔ M_CRSRD_LANE_INF.AREA_SEQNO"
    reason: "번호는 겹치지만 회전·차로가 맞지 않음"
    status: 미확인

rules:
  - "이름은 키가 아니다. 사람이 읽는 키는 표시와 질문 해석에만 쓰고, 조인은 기계 키로 한다."
  - "방향 표기는 '북(남향)' 형식. 공백 없이 위치 + '(' + 진행방향 + '향)'."
  - "접근로 중복 키(BC002N0275/ACSR000002)는 v_approach_key에서 표시값을 비우고 '미확인'으로 둔다. 임의로 한 행을 고르지 않는다."
  - "측정 테이블: TOT_DT는 구간 시작, 0대 구간은 행 없음, DRCT_CD는 01~05로 거름, 1DD는 TRUNC(TOT_DT)로 묶음."
  - "회전 단위 측정의 LOS와 VC는 비어 있다(2026-11-24 하루 확인). V_LOS는 0만 있다."

unconfirmed:
  - {item: LOS, question: "LOS 숫자의 단위와 산식", known: "0~999.9 연속 숫자. DB 주석은 'LOS'·'서비스 수준'뿐", status: 미확인}
  - {item: RING_DRCT_CD, question: "신호 이력의 링 방향 코드(이동류) 0~18의 뜻", known: "코드표 없음", status: 미확인}
  - {item: CAMERA_ROLE, question: "카메라 이름 '4K', '과', 가상 카메라의 역할", status: 미확인}
  - {item: ACSR_DUP_KEY, question: "접근로 중복 키 BC002N0275 / ACSR000002 처리", known: "두 행의 진입 위치가 서로 다름", status: 미확인}
  - {item: SGNL_CMR_MC, question: "M_CRSRD_SGNL_CMR_MC 사용 여부", status: 미확인}
  - {item: LANE_DRCT_CD, question: "차로 테이블 DRCT_CD 01~10의 코드표", status: 미확인}

