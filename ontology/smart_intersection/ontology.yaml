  - {from: Approach, rel: has_movement, to: Movement, keys: [node_id, acsr_id], cardinality: "1 : 1~4", evidence: "4,122행 중 접근로 마스터에 없는 키 46행", status: 확인}
  - {from: Approach, rel: has_lane, to: Lane, keys: [node_id, acsr_id], cardinality: "1 : 0..N", evidence: "2,709행 중 접근로 마스터에 없는 키 25행", status: 확인}
  - {from: Intersection, rel: controlled_by, to: SignalController, keys: [node_id], cardinality: "1 : 1", evidence: "286/286", status: 확인}
  - {from: Approach, rel: has_signal_plan, to: ApproachSignalPlan, keys: [node_id, acsr_id], cardinality: "1 : 1", evidence: "모든 접근로 키에 신호 조건 있음. 신호 조건 2행은 접근로 마스터에 없는 키", status: 확인}
  - {from: Camera, rel: at, to: Intersection, keys: [node_id], cardinality: "N : 1", evidence: "1,344/1,344, 교차로 286곳 모두 카메라 있음", status: 확인}
  - {from: Camera, rel: observes, to: Approach, keys: [node_id, acsr_id], cardinality: "N : 1", evidence: "1,338/1,338, 방향 1,028개", status: 확인}
  - {from: Movement, rel: coded_by, to: Code, keys: ["drct_cd = cd (grp_cd='DRCT_CD')"], status: 확인}
  - {from: Lane, rel: coded_by, to: Code, keys: ["drct_cd = cd (grp_cd='DRCT_CD')"], note: "01~05만. 06~10은 무시", status: 확인}
  - {from: Approach, rel: has_cameras, to: Camera, keys: [node_id, acsr_id], view: onto_v2.v_approach_camera, cardinality: "1 : 0..N", status: 확인}
  - {from: Approach, rel: coded_by, to: Code, keys: ["acsr_drct = cd (grp_cd='ACSR_DRCT')"], note: "참고용. 키로 쓰지 않음", status: 확인}

forbidden_joins:
  - table: CRSRD.M_CRSRD_SGNL_CMR_MC
    reason: "사용 안 함(민호님 결정 2026-11-26). 제어기 ID가 신호 마스터와 405/739행만 맞음. 조인하지 않고 store에도 적재하지 않음"
    status: "확인(사용 안 함)"
  - table: "CRSRD.M_CRSRD_SGNL_AREA_CNFG_INF.AREA_SEQNO ↔ M_CRSRD_LANE_INF.AREA_SEQNO"
    reason: "번호는 겹치지만 회전·차로가 맞지 않음"
    status: 미확인

rules:
  - "이름은 키가 아니다. 사람이 읽는 키는 표시와 질문 해석에만 쓰고, 조인은 기계 키로 한다."
  - "방향 표기는 '북(남향)' 형식. 공백 없이 위치 + '(' + 진행방향 + '향)'."
  - "v_excluded_approach에 적힌 접근로(BC002N0275/ACSR000002)는 실제로는 없는 접근로다. 유효 뷰에서 빼고, 그 접근로의 회전·신호 행을 다른 접근로로 옮기지 않는다."
  - "같은 키에 행이 여러 개인 접근로가 새로 생기면 v_approach_key에서 표시값을 비우고 '미확인'으로 둔다. 임의로 한 행을 고르지 않는다."
  - "측정 테이블: TOT_DT는 구간 시작, 0대 구간은 행 없음, DRCT_CD는 01~05로 거름, 1DD는 TRUNC(TOT_DT)로 묶음."
  - "회전 단위 측정의 LOS와 VC는 비어 있다(2026-11-24 하루 확인). V_LOS는 0만 있다."
  - "LOS 값은 등급이다(단위가 아님)."
  - "RING_DRCT_CD(신호 이력 링 방향 코드)는 온톨로지에서 제외한다. 뷰·용어에 쓰지 않는다."
  - "차로 DRCT_CD는 01~05만 유효하다. 06~10은 무시한다(민호님 결정 2026-11-26). v_lane에서 빼고 마스터 행은 지우지 않는다."
  - "카메라 역할은 구분하지 않는다. 접근로별 카메라는 v_approach_camera로 모두 나열한다."

excluded:
  - {item: RING_DRCT_CD, reason: "온톨로지에서 제외(민호님 결정 2026-11-26)"}
  - {item: CRSRD.M_CRSRD_SGNL_CMR_MC, reason: "사용 안 함(민호님 결정 2026-11-26)"}

decisions:
  - {item: LOS, decision: "LOS 값은 등급(단위 아님)", date: "2026-11-26", source: "민호님 2026-11-26 15:23 결정(관리자봇 채팅에서 직접 답함), 15:34 진행 승인", status: 확인}
  - {item: RING_DRCT_CD, decision: "온톨로지에서 제외", date: "2026-11-26", source: "민호님 2026-11-26 15:23 결정(관리자봇 채팅에서 직접 답함), 15:34 진행 승인", status: 확인}
  - {item: CAMERA_ROLE, decision: "4K·교·가상 카메라 역할을 정하지 않고 node_id·acsr_id별로 카메라를 모두 나열(v_approach_camera)", date: "2026-11-26", source: "민호님 2026-11-26 15:23 결정(관리자봇 채팅에서 직접 답함), 15:34 진행 승인", status: 확인}
  - {item: SGNL_CMR_MC, decision: "M_CRSRD_SGNL_CMR_MC 쓰지 않음", date: "2026-11-26", source: "민호님 2026-11-26 15:23 결정(관리자봇 채팅에서 직접 답함), 15:34 진행 승인", status: 확인}
  - {item: LANE_DRCT_CD, decision: "M_CD_INF GRP_CD='DRCT_CD' CD→CD_NM(01 좌회전, 02 직진, 03 우회전, 04 유턴, 05 직우)로 이름을 붙임", date: "2026-11-26", source: "민호님 2026-11-26 15:23 결정(관리자봇 채팅에서 직접 답함), 15:34 진행 승인", status: 확인}
  - {item: LANE_DRCT_CD_06_10, decision: "차로 DRCT_CD 06~10(362행)은 무시. 01~05만 유효. v_lane에서 제외, 마스터 행은 유지", date: "2026-11-26", source: "민호님 2026-11-26 15:34 결정(관리자봇 채팅): '06~10은 무시한다. 01~05만 유효한것으로 인정'", status: 확인}
