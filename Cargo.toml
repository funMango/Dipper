[package]
name = "dipper"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/funMango/Dipper"
description = "Dipper picks only the data you need out of multiple large databases and moves it into a small store, so you can search and analyze it quickly on your own PC or in the cloud."

[lib]
name = "dipper"
path = "src/lib.rs"

[[bin]]
name = "dipper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
oracle = { version = "0.6", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[features]
default = []
oracle = ["dep:oracle"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
