name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # v0 caches restored a partial target and broke libduckdb-sys unpack.
          prefix-key: v1-rust
      - name: Drop incomplete bundled DuckDB sources
        shell: bash
        run: |
          root=target/duckdb-sources
          if [ -d "$root" ]; then
            for dir in "$root"/*; do
              [ -d "$dir" ] || continue
              if [ ! -f "$dir/.complete" ]; then
                rm -rf "$dir"
              fi
            done
          fi
      - run: cargo fmt --all -- --check
      - name: No commit paths in src (DuckDB store excepted)
        shell: bash
        run: |
          hits="$(grep -rnE '\.commit[[:space:]]*\(|set_autocommit[[:space:]]*\([[:space:]]*true|"[^"]*COMMIT' src/ || true)"
          echo "$hits"
          if echo "$hits" | grep -vE '^src/store/' | grep -q .; then
            echo "commit path found outside src/store/"; exit 1
          fi
      - name: Driver SQL calls only in source executors and the DuckDB store
        shell: bash
        run: |
          hits="$(grep -rnE '\.(execute|execute_batch|execute_named|query|query_row|query_row_as|query_as|query_map|prepare|prepare_cached|statement|pragma_update|pragma_query_value)[[:space:]]*\(' src/ || true)"
          echo "$hits"
          if echo "$hits" | grep -vE '^src/source/(sqlite|oracle)\.rs:|^src/store/' | grep -q .; then
            echo "driver SQL call outside src/source/{sqlite,oracle}.rs and src/store/"; exit 1
          fi
      - name: Source drivers only in src/source, DuckDB only in src/store
        shell: bash
        run: |
          if grep -rnE '\b(rusqlite|oracle)::|^use (rusqlite|oracle)\b' src/ | grep -vE '^src/source/'; then
            echo "source driver used outside src/source/"; exit 1
          fi
          if grep -rnE '\bduckdb::|^use duckdb\b' src/ | grep -vE '^src/store/'; then
            echo "duckdb used outside src/store/"; exit 1
          fi
      - name: Skill and adapter files
        shell: bash
        run: |
          test -f skills/dipper/SKILL.md
          test -f .claude/skills/dipper/SKILL.md
          test -f .cursor/rules/dipper.mdc
          test -f AGENTS.md
          grep -q '^name: dipper$' .claude/skills/dipper/SKILL.md
          grep -q '^description: Pull and enrich Dipper table ontologies' .claude/skills/dipper/SKILL.md
          grep -q 'skills/dipper/SKILL.md' .claude/skills/dipper/SKILL.md
          grep -q '^description: Dipper CLI workflow' .cursor/rules/dipper.mdc
          grep -q '^alwaysApply: false$' .cursor/rules/dipper.mdc
          grep -q 'skills/dipper/SKILL.md' .cursor/rules/dipper.mdc
          grep -q 'skills/dipper/SKILL.md' AGENTS.md
          for phrase in "ontology pull" "check-relation" "ontology validate" "ontology render" "DIPPER_ORA_USER" "DIPPER_ORA_PASSWORD" "DIPPER_AI_" "GuardedSelect"; do
            grep -q "$phrase" skills/dipper/SKILL.md || { echo "missing skill phrase: $phrase"; exit 1; }
          done
          if grep -RInE 'DIPPER_AI_' src .claude .cursor AGENTS.md; then
            echo "DIPPER_AI_ reference found outside the skill prohibition"; exit 1
          fi
          if grep -nE 'DIPPER_AI_[A-Z0-9_]+[[:space:]]*=|env::var\([[:space:]]*"DIPPER_AI_' skills/dipper/SKILL.md; then
            echo "DIPPER_AI_ assignment or env read in the skill"; exit 1
          fi
          if grep -RInE '(^|[^A-Za-z0-9_])rmcp([^A-Za-z0-9_]|$)' Cargo.toml Cargo.lock src; then
            echo "rmcp MCP crate found"; exit 1
          fi
          if grep -RInE 'sk-[A-Za-z0-9]{20,}|api\.anthropic\.com|api\.openai\.com' skills .claude .cursor AGENTS.md src; then
            echo "external AI client or key found"; exit 1
          fi
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Default build has no Oracle dependency
        shell: bash
        run: |
          tree="$(cargo tree -e normal --locked --prefix none)"
          echo "$tree"
          if echo "$tree" | grep -E '^(oracle|odpic-sys) '; then
            echo "oracle dependency found in default build"; exit 1
          fi
          cargo tree -e normal --locked --prefix none --features oracle | grep -E '^oracle '
      - run: cargo clippy --all-targets --features oracle --locked -- -D warnings
      - run: cargo test --features oracle --locked

  windows-exe:
    name: windows-exe (${{ matrix.name }})
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build_args: ""
          - name: oracle
            build_args: "--features oracle"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Drop incomplete bundled DuckDB sources
        shell: bash
        run: |
          root=target/duckdb-sources
          if [ -d "$root" ]; then
            for dir in "$root"/*; do
              [ -d "$dir" ] || continue
              if [ ! -f "$dir/.complete" ]; then
                rm -rf "$dir"
              fi
            done
          fi
      - run: cargo build --release --locked ${{ matrix.build_args }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Show dumpbin dependents and reject CRT DLLs
        shell: pwsh
        run: |
          $output = & dumpbin /dependents target\release\dipper.exe | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lower = $output.ToLowerInvariant()
          foreach ($bad in @('vcruntime', 'api-ms-win-crt', 'ucrtbase', 'msvcp')) {
            if ($lower.Contains($bad)) { Write-Output "forbidden CRT dependency: $bad"; exit 1 }
          }
      - name: Run dipper.exe --version
        run: target\release\dipper.exe --version
