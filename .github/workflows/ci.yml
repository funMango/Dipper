name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: No commit paths in src (DuckDB store excepted)
        shell: bash
        run: |
          hits="$(grep -rnE '\.commit[[:space:]]*\(|set_autocommit[[:space:]]*\([[:space:]]*true|"[^"]*COMMIT' src/ || true)"
          echo "$hits"
          if echo "$hits" | grep -vE '^src/store/' | grep -q .; then
            echo "commit path found outside src/store/"; exit 1
          fi
      - name: Driver SQL calls only in source executors and the DuckDB store
        shell: bash
        run: |
          hits="$(grep -rnE '\.(execute|execute_batch|execute_named|query|query_row|query_row_as|query_as|query_map|prepare|prepare_cached|statement|pragma_update|pragma_query_value)[[:space:]]*\(' src/ || true)"
          echo "$hits"
          if echo "$hits" | grep -vE '^src/source/(sqlite|oracle)\.rs:|^src/store/' | grep -q .; then
            echo "driver SQL call outside src/source/{sqlite,oracle}.rs and src/store/"; exit 1
          fi
      - name: Source drivers only in src/source, DuckDB only in src/store
        shell: bash
        run: |
          if grep -rnE '\b(rusqlite|oracle)::|^use (rusqlite|oracle)\b' src/ | grep -vE '^src/source/'; then
            echo "source driver used outside src/source/"; exit 1
          fi
          if grep -rnE '\bduckdb::|^use duckdb\b' src/ | grep -vE '^src/store/'; then
            echo "duckdb used outside src/store/"; exit 1
          fi
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Default build has no Oracle dependency
        shell: bash
        run: |
          tree="$(cargo tree -e normal --locked --prefix none)"
          echo "$tree"
          if echo "$tree" | grep -E '^(oracle|odpic-sys) '; then
            echo "oracle dependency found in default build"; exit 1
          fi
          cargo tree -e normal --locked --prefix none --features oracle | grep -E '^oracle '
      - run: cargo clippy --all-targets --features oracle --locked -- -D warnings
      - run: cargo test --features oracle --locked

  windows-exe:
    name: windows-exe (${{ matrix.name }})
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build_args: ""
          - name: oracle
            build_args: "--features oracle"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked ${{ matrix.build_args }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Show dumpbin dependents and reject CRT DLLs
        shell: pwsh
        run: |
          $output = & dumpbin /dependents target\release\dipper.exe | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lower = $output.ToLowerInvariant()
          foreach ($bad in @('vcruntime', 'api-ms-win-crt', 'ucrtbase', 'msvcp')) {
            if ($lower.Contains($bad)) { Write-Output "forbidden CRT dependency: $bad"; exit 1 }
          }
      - name: Run dipper.exe --version
        run: target\release\dipper.exe --version
